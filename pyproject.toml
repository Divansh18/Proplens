[project]
name = "proplens"
version = "0.1.0"
description = "AI property assistant for DarGlobal and Wasalt"
requires-python = ">=3.11,<4"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
